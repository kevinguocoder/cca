<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube Leaderboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Custom Scrollbar for the table container */
        .table-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Loading spinner animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen p-4 md:p-6 lg:p-8">

    <div class="max-w-7xl mx-auto flex flex-col gap-6 h-full">
        
        <!-- Header area -->
        <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <!-- SVG Cube Icon -->
                <div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center p-1 shadow-inner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-blue-600">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-tight text-slate-900">Cubing Leaderboard</h1>
                    <p class="text-sm text-slate-500">Live global records</p>
                </div>
            </div>

            <!-- Global Event Filter -->
            <div class="flex items-center gap-2 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200 w-full sm:w-auto">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-slate-400">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
                <select id="global-filter" class="bg-transparent border-none outline-none text-sm font-semibold text-slate-700 w-full cursor-pointer focus:ring-0">
                    <option value="3x3">3x3 Standard</option>
                    <option value="2x2">2x2 Mini</option>
                    <option value="4x4">4x4 Master</option>
                    <option value="5x5">5x5 Professor</option>
                    <option value="3x3 OH">3x3 One-Handed</option>
                    <option value="3x3 One Side">3x3 One Side (Beginner)</option>
                    <option value="Pyraminx">Pyraminx</option>
                </select>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Left Side: Add Form -->
            <div class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-6">
                <h2 class="text-lg font-semibold mb-5 flex items-center gap-2">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-green-500">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    Record a Time
                </h2>
                
                <form id="record-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Cuber's Name</label>
                        <input type="text" id="input-name" required placeholder="e.g. Ernő Rubik" 
                            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Time</label>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="relative">
                                    <input type="number" id="input-minutes" min="0" step="1" placeholder="0" 
                                        class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all font-mono text-sm">
                                    <span class="absolute right-2 top-2.5 text-slate-400 text-sm">m</span>
                                </div>
                                <div class="relative">
                                    <input type="number" id="input-seconds" required step="0.01" min="0" max="59.99" placeholder="0.00" 
                                        class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all font-mono text-sm">
                                    <span class="absolute right-2 top-2.5 text-slate-400 text-sm">s</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                            <input type="date" id="input-date" required 
                                class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Event Category</label>
                        <select id="input-event" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all text-sm">
                            <option value="3x3">3x3 Standard</option>
                            <option value="2x2">2x2 Mini</option>
                            <option value="4x4">4x4 Master</option>
                            <option value="5x5">5x5 Professor</option>
                            <option value="3x3 OH">3x3 One-Handed</option>
                            <option value="3x3 One Side">3x3 One Side (Beginner)</option>
                            <option value="Pyraminx">Pyraminx</option>
                        </select>
                    </div>

                    <!-- Custom Message Box for errors/success -->
                    <div id="message-box" class="hidden p-3 rounded-lg text-sm font-medium transition-all"></div>

                    <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 mt-2">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                        Submit Record
                    </button>
                </form>
            </div>

            <!-- Right Side: Leaderboard Data -->
            <div class="lg:col-span-8 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col" style="min-height: 500px;">
                <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <h2 class="text-lg font-semibold text-slate-800" id="table-title">3x3 Standard Rankings</h2>
                    <span id="record-count" class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-full">0 Records</span>
                </div>

                <div class="flex-1 relative overflow-auto table-container">
                    
                    <!-- Loading Overlay -->
                    <div id="loading-overlay" class="absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center">
                        <svg class="spinner w-8 h-8 text-blue-500 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="2" x2="12" y2="6"></line>
                            <line x1="12" y1="18" x2="12" y2="22"></line>
                            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                            <line x1="2" y1="12" x2="6" y2="12"></line>
                            <line x1="18" y1="12" x2="22" y2="12"></line>
                            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                        </svg>
                        <p class="text-slate-500 text-sm font-medium">Syncing global data...</p>
                    </div>

                    <!-- Empty State -->
                    <div id="empty-state" class="hidden absolute inset-0 z-0 flex flex-col items-center justify-center p-8 text-center bg-white">
                        <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-4 border border-slate-100">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 text-slate-300">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="3" y1="9" x2="21" y2="9"></line>
                                <line x1="9" y1="21" x2="9" y2="9"></line>
                            </svg>
                        </div>
                        <h3 class="text-slate-800 font-semibold mb-1">No times recorded yet</h3>
                        <p class="text-slate-500 text-sm max-w-xs mx-auto">Select a different event or be the first to set a record for this category!</p>
                    </div>

                    <!-- Table -->
                    <table class="w-full text-left border-collapse min-w-[500px]" id="leaderboard-table">
                        <thead class="bg-white sticky top-0 z-0 shadow-sm border-b border-slate-200">
                            <tr>
                                <th class="py-3.5 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider w-20 text-center">Rank</th>
                                <th class="py-3.5 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider">Cuber</th>
                                <th class="py-3.5 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider text-right">Time (s)</th>
                                <th class="py-3.5 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider hidden sm:table-cell">Date</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-100 bg-white">
                            <!-- Rows rendered via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global environment variables (provided by the sandbox environment)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-rubiks-app';
        const firebaseConfig = {
        apiKey: "AIzaSyAarC9NdxLDVYO72vS076ScO2QXPAYWbwk",
        authDomain: "ccarecords-72e76.firebaseapp.com",
        projectId: "ccarecords-72e76",
        storageBucket: "ccarecords-72e76.firebasestorage.app",
        messagingSenderId: "1000449928287",
        appId: "1:1000449928287:web:e00a5c2390be2dd2f6bfea",
        measurementId: "G-CC1L52S78K"
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // App State
        let app, auth, db;
        let allRecords = []; // Holds all unfiltered data from Firestore
        let currentUser = null;

        // DOM Elements
        const form = document.getElementById('record-form');
        const inputName = document.getElementById('input-name');
        const inputMinutes = document.getElementById('input-minutes');
        const inputSeconds = document.getElementById('input-seconds');
        const inputDate = document.getElementById('input-date');
        const inputEvent = document.getElementById('input-event');
        
        const globalFilter = document.getElementById('global-filter');
        const tableBody = document.getElementById('table-body');
        const tableTitle = document.getElementById('table-title');
        const recordCount = document.getElementById('record-count');
        
        const loadingOverlay = document.getElementById('loading-overlay');
        const emptyState = document.getElementById('empty-state');
        const submitBtn = document.getElementById('submit-btn');
        const messageBox = document.getElementById('message-box');

        // Set default date to today
        inputDate.valueAsDate = new Date();

        
        // Helper: Format time nicely (e.g., 65.42 -> 1:05.42)
        function formatTimeDisplay(seconds) {
            const num = parseFloat(seconds);
            if (isNaN(num)) return "0.00";
            
            if (num >= 60) {
                const m = Math.floor(num / 60);
                const s = (num % 60).toFixed(2);
                return `${m}:${s.padStart(5, '0')}`;
            }
            return num.toFixed(2);
        }

        // Helper: Format Date safely
        function formatDateDisplay(dateString) {
            if (!dateString) return "-";
            try {
                // Parse YYYY-MM-DD cleanly without timezone shift issues
                const [year, month, day] = dateString.split('-');
                if(!year || !month || !day) return dateString;
                const date = new Date(year, month - 1, day);
                return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
            } catch(e) {
                return dateString;
            }
        }

        // Helper: Show UI Messages (replacing alert)
        function showMessage(msg, isError = false) {
            messageBox.textContent = msg;
            messageBox.className = `p-3 rounded-lg text-sm font-medium transition-all block mb-4 ${
                isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'
            }`;
            
            // Auto hide after 4 seconds
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 4000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(unsafe) {
            return (unsafe || "").toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        
        function renderLeaderboard() {
            const selectedEvent = globalFilter.value;
            
            // Sync form selection with global filter if it makes sense visually
            inputEvent.value = selectedEvent;
            
            // Update Title
            const eventText = globalFilter.options[globalFilter.selectedIndex].text;
            tableTitle.textContent = `${eventText} Rankings`;

            // Filter in memory (RULE 2 compliance)
            let filteredRecords = allRecords.filter(record => record.event === selectedEvent);

            // Sort in memory (shortest time first)
            filteredRecords.sort((a, b) => parseFloat(a.time) - parseFloat(b.time));

            // Update UI count
            recordCount.textContent = `${filteredRecords.length} Record${filteredRecords.length !== 1 ? 's' : ''}`;

            // Handle empty state
            if (filteredRecords.length === 0) {
                tableBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Generate HTML Rows
            tableBody.innerHTML = filteredRecords.map((record, index) => {
                let rankVisual = `${index + 1}`;
                let rowClasses = "hover:bg-slate-50 transition-colors group";
                let rankClasses = "text-slate-400 font-medium";
                let timeClasses = "text-slate-700 font-mono font-bold text-base md:text-lg tracking-tight";
                
                // Special styling for top 3
                if (index === 0) {
                    rankVisual = `<svg class="w-6 h-6 mx-auto text-yellow-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15l-4.224 2.816.805-4.704L5.16 9.776l4.72-.686L12 4.8l2.12 4.29 4.72.686-3.421 3.336.805 4.704z"/></svg>`;
                    rowClasses = "bg-yellow-50/50 hover:bg-yellow-100/50 transition-colors border-l-4 border-yellow-400 group";
                    timeClasses = "text-yellow-700 font-mono font-bold text-lg tracking-tight";
                } else if (index === 1) {
                    rankClasses = "text-slate-400 font-bold text-lg";
                    rowClasses = "bg-slate-50/50 hover:bg-slate-100/80 transition-colors border-l-4 border-slate-300 group";
                } else if (index === 2) {
                    rankClasses = "text-amber-700 font-bold text-lg";
                    rowClasses = "bg-orange-50/30 hover:bg-orange-50/80 transition-colors border-l-4 border-amber-600/50 group";
                } else {
                    rowClasses += " border-l-4 border-transparent";
                }

                return `
                    <tr class="${rowClasses}">
                        <td class="py-4 px-6 text-center ${rankClasses}">
                            ${rankVisual}
                        </td>
                        <td class="py-4 px-6">
                            <div class="font-semibold text-slate-800">${escapeHtml(record.name)}</div>
                        </td>
                        <td class="py-4 px-6 text-right">
                            <div class="${timeClasses} group-hover:text-blue-600 transition-colors">
                                ${formatTimeDisplay(record.time)}
                            </div>
                        </td>
                        <td class="py-4 px-6 text-slate-500 text-sm hidden sm:table-cell">
                            ${formatDateDisplay(record.date)}
                        </td>
                    </tr>
                `;
            }).join('');
        }


        async function initFirebase() {
            if (!firebaseConfig) {
                loadingOverlay.innerHTML = '<p class="text-red-500 text-sm">Error: Firebase config missing.</p>';
                return;
            }

            try {
                // Initialize
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Auth Before Queries (RULE 3 compliance)
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUser = auth.currentUser;

                // Set up snapshot listener on Public Data path (RULE 1 compliance)
                const dataCollection = collection(db, 'artifacts', appId, 'public', 'data', 'cubing_records');
                
                // No complex queries (RULE 2 compliance) - just fetch all and listen
                onSnapshot(dataCollection, (snapshot) => {
                    allRecords = [];
                    snapshot.forEach((doc) => {
                        allRecords.push({ id: doc.id, ...doc.data() });
                    });
                    
                    loadingOverlay.classList.add('hidden');
                    renderLeaderboard();
                }, (error) => {
                    console.error("Firestore Listen Error:", error);
                    loadingOverlay.innerHTML = '<p class="text-red-500 text-sm">Failed to sync records. Check console.</p>';
                });

            } catch (err) {
                console.error("Init Error:", err);
                loadingOverlay.innerHTML = '<p class="text-red-500 text-sm">Database connection failed.</p>';
            }
        }


        // When the global filter changes, re-render the table
        globalFilter.addEventListener('change', () => {
            renderLeaderboard();
        });

        // When the form event dropdown changes, automatically update the global filter to match
        // so the user immediately sees the board they are submitting to.
        inputEvent.addEventListener('change', (e) => {
            globalFilter.value = e.target.value;
            renderLeaderboard();
        });

        // Handle Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Guard clause (RULE 3 compliance)
            if (!currentUser) {
                showMessage("Authentication error. Cannot save.", true);
                return;
            }

            // Extract Data
            const name = inputName.value.trim();
            const minsVal = parseInt(inputMinutes.value) || 0;
            const secsVal = parseFloat(inputSeconds.value);
            const dateStr = inputDate.value;
            const eventStr = inputEvent.value;

            const timeVal = (minsVal * 60) + secsVal;

            if (!name || isNaN(timeVal) || timeVal <= 0) {
                showMessage("Please enter a valid name and time.", true);
                return;
            }

            // UI Feedback during save
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = `
                <svg class="spinner w-4 h-4 mr-2 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
                Saving...
            `;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                const dataCollection = collection(db, 'artifacts', appId, 'public', 'data', 'cubing_records');
                
                await addDoc(dataCollection, {
                    name: name,
                    time: timeVal,
                    date: dateStr,
                    event: eventStr,
                    userId: currentUser.uid,
                    timestamp: serverTimestamp()
                });

                // Success cleanup
                inputName.value = '';
                inputMinutes.value = '';
                inputSeconds.value = '';
                // Keep date and event as they are likely entering multiple for same day/event
                
                showMessage(`Successfully recorded ${formatTimeDisplay(timeVal)} for ${eventStr}!`);
                
                // Ensure the leaderboard shows the event they just submitted to
                globalFilter.value = eventStr;
                renderLeaderboard();

                inputName.focus(); // focus back to name for rapid entry
            } catch (err) {
                console.error("Save Error:", err);
                showMessage("Failed to save time. See console.", true);
            } finally {
                // Restore button
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });

        // Initialize App on load
        initFirebase();

    </script>
</body>
</html>
